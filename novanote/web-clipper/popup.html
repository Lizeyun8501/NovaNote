<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e94560;
    }
    .content { padding: 12px 16px; }
    .form-group { margin-bottom: 10px; }
    label {
      display: block;
      font-size: 11px;
      color: #a0a0a0;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #e94560;
    }
    textarea { resize: vertical; min-height: 60px; }
    .clip-modes {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .clip-mode {
      flex: 1;
      padding: 8px 4px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #16213e;
      color: #a0a0a0;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clip-mode:hover { border-color: #e94560; color: #e0e0e0; }
    .clip-mode.active {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }
    .btn-clip {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #e94560;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-clip:hover { opacity: 0.9; }
    .btn-clip:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 8px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    .status.success { display: block; background: #22c55e20; color: #22c55e; }
    .status.error { display: block; background: #ef444420; color: #ef4444; }
    .server-config {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #0f3460;
    }
    .server-config summary {
      font-size: 11px;
      color: #a0a0a0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>NovaNote Clipper</h1>
  </div>
  <div class="content">
    <div class="clip-modes">
      <div class="clip-mode active" data-mode="full">Full Page</div>
      <div class="clip-mode" data-mode="selection">Selection</div>
      <div class="clip-mode" data-mode="bookmark">Bookmark</div>
    </div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="title" placeholder="Page title">
    </div>

    <div class="form-group">
      <label>Tags (comma separated)</label>
      <input type="text" id="tags" placeholder="web, article, reference">
    </div>

    <div class="form-group">
      <label>Folder</label>
      <select id="folder">
        <option value="clippings">Clippings</option>
        <option value="inbox">Inbox</option>
        <option value="reading-list">Reading List</option>
      </select>
    </div>

    <button class="btn-clip" id="clipBtn">Clip to NovaNote</button>

    <div class="status" id="status"></div>

    <details class="server-config">
      <summary>Server Settings</summary>
      <div class="form-group" style="margin-top:8px">
        <label>NovaNote Server URL</label>
        <input type="text" id="serverUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
