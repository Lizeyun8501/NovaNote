[package]
name = "novanote-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = ["dep:rocksdb"]
wasm = []

[dependencies]
# Always available (WASM-compatible)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
yrs = "0.20"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# Native dependencies (used by vault_impl, sync modules)
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
rocksdb = { version = "0.22", optional = true }
prost = "0.13"
notify = { version = "7", features = [] }
walkdir = "2"
tar = "0.4"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", features = ["json"] }
mailparse = "0.15"
tokio = { version = "1", features = ["sync", "time"] }
hmac = "0.12"
sha2 = "0.10"
dirs = "5"
whoami = "1"
