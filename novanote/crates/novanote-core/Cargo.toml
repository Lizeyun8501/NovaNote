[package]
name = "novanote-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["native", "sync"]
native = ["dep:rocksdb", "dep:coset", "dep:p256", "dep:printpdf", "dep:tantivy", "dep:notify"]
wasm = []
# Split from "native": only needed when running the sync server/engine
sync = []
# Split from "native": full-text search with Tantivy
tantivy-search = ["dep:tantivy"]
# Split from "native": file system watching
fs-watch = ["dep:notify"]
# Split from "native": PDF export support
pdf-export = ["dep:printpdf"]
# Split from "native": authentication/key management
auth = ["dep:coset", "dep:p256"]

[dependencies]
# Always available (WASM-compatible)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
yrs = "0.20"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# Native dependencies (used by vault_impl, sync modules)
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "functions"] }
rocksdb = { version = "0.22", optional = true }
prost = "0.13"
notify = { version = "7", optional = true }
walkdir = "2"
tar = "0.4"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", features = ["json"] }
mailparse = "0.15"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
dirs = "5"
whoami = "1"
url = "2"

# WebAuthn verification (native only)
coset = { version = "0.3", optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
printpdf = { version = "0.7", optional = true }

# Tantivy full-text search engine (native only)
tantivy = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
rstest = "0.18"