[package]
name = "novanote-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["native"]
native = [
    "dep:rusqlite", "dep:rocksdb", "dep:prost", "dep:notify", "dep:walkdir",
    "dep:tar", "dep:pulldown-cmark", "dep:reqwest", "dep:mailparse",
    "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util",
    "dep:hmac", "dep:sha2", "dep:dirs", "dep:whoami", "dep:url",
    "dep:coset", "dep:p256", "dep:printpdf", "dep:tantivy",
]
wasm = []

[dependencies]
# Always available (WASM-compatible)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
yrs = "0.20"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
once_cell = "1"

# WASM-compatible optional deps (always available for feature-gated modules)
prost = { version = "0.13", optional = true }

# Native dependencies (used by vault_impl, sync modules)
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "functions"], optional = true }
rocksdb = { version = "0.22", optional = true }
notify = { version = "7", optional = true }
walkdir = { version = "2", optional = true }
tar = { version = "0.4", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
mailparse = { version = "0.15", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "io-util", "net"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["connect"], optional = true }
futures-util = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
dirs = { version = "5", optional = true }
whoami = { version = "1", optional = true }
url = { version = "2", optional = true }

# WebAuthn verification (native only)
coset = { version = "0.3", optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
printpdf = { version = "0.7", optional = true }

# Tantivy full-text search engine (native only)
tantivy = { version = "0.22", optional = true }
