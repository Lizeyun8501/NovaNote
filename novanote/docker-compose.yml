version: "3.8"

services:
  sync-server:
    build:
      context: .
      dockerfile: crates/novanote-sync-server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://novanote:novanote_secret@postgres:5432/novanote_sync
      - REDIS_URL=redis://redis:6379
      - BIND_ADDR=0.0.0.0:3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RUST_LOG=info
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=novanote-sync
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    volumes:
      - sync-data:/app/data
    networks:
      - novanote-net

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=novanote
      - POSTGRES_PASSWORD=novanote_secret
      - POSTGRES_DB=novanote_sync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanote -d novanote_sync"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - novanote-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - novanote-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - novanote-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  sync-data:

networks:
  novanote-net:
    driver: bridge
