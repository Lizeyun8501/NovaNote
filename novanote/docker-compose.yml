version: "3.8"

services:
  sync-server:
    build:
      context: .
      dockerfile: Dockerfile.sync-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://novanote:novanote_secret@postgres:5432/novanote_sync
      - REDIS_URL=redis://redis:6379
      - BIND_ADDR=0.0.0.0:3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - sync-data:/app/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=novanote
      - POSTGRES_PASSWORD=novanote_secret
      - POSTGRES_DB=novanote_sync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanote -d novanote_sync"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  sync-data: